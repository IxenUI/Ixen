name: verify

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: install the android workload
        run: dotnet workload install android

      - name: verify
        shell: powershell
        run: .\verify.ps1

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: install what the native library and the font fallback need
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxcursor-dev libdbus-1-dev libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev fonts-droid-fallback

      - name: verify
        run: bash ./verify-linux.sh --skip-host-frame
